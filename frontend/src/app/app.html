<main class="main">
  <nav class="app-nav">
    <div class="app-nav-left">
      <a class="app-link" routerLink="/tournaments" routerLinkActive="active"
        >Tournois</a
      >
      @for (link of navLinks(); track $index) {
        <a
          class="app-link"
          [routerLink]="link.routerLink"
          [queryParams]="link.queryParams"
        >
          {{ link.label }}
        </a>
      }
    </div>
    <div class="app-nav-right">
      <a class="app-link" routerLink="/render-queue" routerLinkActive="active"
        >Render queue</a
      >
      @for (action of navActions(); track $index) {
        <button class="app-link" type="button" (click)="action.onClick()">
          {{ action.label }}
        </button>
      }
      <button
        class="app-link theme-toggle"
        type="button"
        (click)="themeService.toggle()"
        [attr.aria-label]="
          themeService.theme() === 'dark'
            ? 'Passer en mode clair'
            : 'Passer en mode sombre'
        "
        [title]="
          themeService.theme() === 'dark'
            ? 'Passer en mode clair'
            : 'Passer en mode sombre'
        "
      >
        <span class="material-icons">{{
          themeService.theme() === "dark" ? "light_mode" : "dark_mode"
        }}</span>
      </button>
    </div>
  </nav>

  <router-outlet />
</main>

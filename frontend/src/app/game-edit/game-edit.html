<div class="game-edit">
  @if (game(); as game) {
    <div>
      <div class="name-row">
        <div class="name-field-block">
          <mat-form-field appearance="outline" class="name-field">
            <mat-label>Name</mat-label>
            <input matInput [(ngModel)]="nameDraft" />
          </mat-form-field>

          <span class="source-name" [title]="'files: ' + game.files">
            files: {{ game.files }}
          </span>
        </div>
      </div>
      <div class="teams-row">
        <app-team-select
          label="Team 1"
          [teams]="teams()"
          [ngModel]="team1Draft()"
          (ngModelChange)="team1Draft.set($event)"
        ></app-team-select>

        <app-team-select
          label="Team 2"
          [teams]="teams()"
          [ngModel]="team2Draft()"
          (ngModelChange)="team2Draft.set($event)"
        ></app-team-select>
      </div>

      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="onSaveNameTeam()"
      >
        Save
      </button>
    </div>

    <div class="proxy-tools">
      <mat-form-field appearance="outline" class="proxy-quality">
        <mat-label>Proxy quality</mat-label>
        <mat-select [(ngModel)]="proxyQuality">
          <mat-option value="low">low</mat-option>
          <mat-option value="medium">medium</mat-option>
          <mat-option value="high">high</mat-option>
        </mat-select>
      </mat-form-field>
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="onGenerateProxy()"
      >
        Generate proxy
      </button>
      <button
        mat-raised-button
        color="accent"
        type="button"
        (click)="onQueueProxy()"
      >
        Add proxy to queue
      </button>
    </div>

    <app-game-edit-cuts [game]="game"></app-game-edit-cuts>
  } @else {
    <p class="loading">Chargement...</p>
  }
</div>

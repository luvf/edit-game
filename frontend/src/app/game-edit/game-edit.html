<div class="game-edit">
  @if (game(); as game) {
    <section class="game-header">
      <!-- Le match : son nom, et ce que la carte d'ouverture en dit. -->
      <div class="header-col header-identity">
        <mat-form-field appearance="outline" class="name-field">
          <mat-label>Name</mat-label>
          <input matInput [(ngModel)]="nameDraft" />
          <mat-hint class="source-name" [title]="'files: ' + game.files">
            files: {{ game.files }}
          </mat-hint>
        </mat-form-field>

        <div class="header-line">
          <mat-form-field appearance="outline" class="match-sets">
            <mat-label>Sets à gagner</mat-label>
            <input
              matInput
              type="number"
              min="1"
              [ngModel]="setsToWinDraft()"
              (ngModelChange)="setsToWinDraft.set($event)"
            />
          </mat-form-field>
          <mat-form-field appearance="outline" class="match-condition">
            <mat-label>Condition de victoire</mat-label>
            <input
              matInput
              placeholder="texte libre, affiché sur la carte d'ouverture"
              [ngModel]="conditionDraft()"
              (ngModelChange)="conditionDraft.set($event)"
            />
          </mat-form-field>
          <button
            mat-raised-button
            color="primary"
            type="button"
            class="save-button"
            (click)="onSaveNameTeam()"
          >
            Save
          </button>
        </div>
      </div>

      <!-- Les equipes, et le score de chacune sous elle. L'equipe 1 commence
           a gauche : c'est elle qui recoit un point marque a gauche. -->
      <div class="header-col header-teams">
        <div class="team-cell">
          <app-team-select
            label="Team 1 — à gauche"
            [teams]="teams()"
            [ngModel]="team1Draft()"
            (ngModelChange)="team1Draft.set($event)"
          ></app-team-select>
          <app-team-create
            (created)="onTeamCreated(1, $event)"
          ></app-team-create>
        </div>

        <button
          mat-stroked-button
          type="button"
          class="swap-teams"
          title="Inverser les équipes : l'équipe 1 est celle qui commence à gauche, et c'est elle qui décide à qui revient un point marqué à gauche. Enregistre aussitôt."
          aria-label="Inverser les équipes"
          (click)="onSwapTeams()"
        >
          ⇄
        </button>

        <div class="team-cell">
          <app-team-select
            label="Team 2 — à droite"
            [teams]="teams()"
            [ngModel]="team2Draft()"
            (ngModelChange)="team2Draft.set($event)"
          ></app-team-select>
          <app-team-create
            (created)="onTeamCreated(2, $event)"
          ></app-team-create>
        </div>

        <mat-form-field appearance="outline" class="start-score">
          <mat-label>Score de départ équipe 1</mat-label>
          <input
            matInput
            placeholder="10-3"
            [ngModel]="startTeam1Draft()"
            (ngModelChange)="startTeam1Draft.set($event)"
            (blur)="padStartScores()"
          />
          <mat-hint title="Vide si le match est filmé dès le début"
            >un tiret par set</mat-hint
          >
        </mat-form-field>

        <mat-form-field appearance="outline" class="start-score start-score-2">
          <mat-label>Score de départ équipe 2</mat-label>
          <input
            matInput
            placeholder="8-0"
            [ngModel]="startTeam2Draft()"
            (ngModelChange)="startTeam2Draft.set($event)"
            (blur)="padStartScores()"
          />
        </mat-form-field>
      </div>

      <!-- Laissee vide expres. -->
      <div class="header-col header-spare"></div>
    </section>

    <app-game-edit-cuts [game]="game"></app-game-edit-cuts>
  } @else {
    <p class="loading">Chargement...</p>
  }
</div>
